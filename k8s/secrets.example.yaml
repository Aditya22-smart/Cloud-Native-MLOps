# k8s/secrets.example.yaml
# Reference template. The real Secret is created dynamically via kubectl create secret or Secret Manager.
apiVersion: v1
kind: Secret
metadata:
  name: pricing-secrets
  namespace: pricing
type: Opaque
stringData:
  RETRAIN_TOKEN: "example-retrain-token-secret"
  JENKINS_RETRAIN_TOKEN: "example-jenkins-token-secret"
  SLACK_WEBHOOK_URL: "https://hooks.slack.com/services/EXAMPLE/WEBHOOK/URL"
  DISCORD_WEBHOOK_URL: "https://discord.com/api/webhooks/EXAMPLE/WEBHOOK/URL"
