apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonLabels:
  env: staging

patches:
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: pricing-ingress
        namespace: pricing
      spec:
        rules:
          - host: pricing-staging.sslip.io
            http:
              paths:
                - path: /api
                  pathType: Prefix
                  backend:
                    service:
                      name: pricing-api
                      port:
                        number: 80
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: pricing-ui
                      port:
                        number: 80
