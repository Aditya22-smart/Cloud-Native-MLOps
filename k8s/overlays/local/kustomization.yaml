apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Local kind cluster doesn't use GCP Ingress, so delete ingress in local overlay
patches:
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: pricing-ingress
        namespace: pricing
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pricing-api
        namespace: pricing
      spec:
        replicas: 1
        template:
          spec:
            containers:
              - name: pricing-api
                image: pricing-api:local
                imagePullPolicy: Never
