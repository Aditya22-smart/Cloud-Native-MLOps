apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

commonLabels:
  env: prod

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: pricing-api
        namespace: pricing
      spec:
        replicas: 2
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: pricing-api
        namespace: pricing
      spec:
        minReplicas: 2
        maxReplicas: 10
  - patch: |-
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: pricing-ingress
        namespace: pricing
      spec:
        rules:
          - host: pricing-prod.sslip.io
            http:
              paths:
                - path: /api
                  pathType: Prefix
                  backend:
                    service:
                      name: pricing-api
                      port:
                        number: 80
                - path: /
                  pathType: Prefix
                  backend:
                    service:
                      name: pricing-ui
                      port:
                        number: 80
