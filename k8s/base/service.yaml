# ClusterIP Service for Web UI
apiVersion: v1
kind: Service
metadata:
  name: pricing-ui
  namespace: pricing
  labels:
    app: pricing-api
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "pricing-backendconfig"}'
spec:
  type: ClusterIP
  selector:
    app: pricing-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
---
# ClusterIP Service for REST API
apiVersion: v1
kind: Service
metadata:
  name: pricing-api
  namespace: pricing
  labels:
    app: pricing-api
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "pricing-backendconfig"}'
spec:
  type: ClusterIP
  selector:
    app: pricing-api
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
