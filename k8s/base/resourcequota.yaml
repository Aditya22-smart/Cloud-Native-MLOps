apiVersion: v1
kind: ResourceQuota
metadata:
  name: pricing-quota
  namespace: pricing
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    requests.ephemeral-storage: "10Gi"
    limits.ephemeral-storage: "20Gi"
    pods: "15"
    services: "10"
    secrets: "10"
    configmaps: "10"
