apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pricing-ingress
  namespace: pricing
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "pricing-ingress-ip"
    kubernetes.io/ingress.allow-http: "false"
spec:
  tls:
    - secretName: tls-pricing-secret
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pricing-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pricing-ui
                port:
                  number: 80
