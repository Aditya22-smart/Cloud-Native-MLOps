services:
  pricing-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dynamic-pricing-api:local
    container_name: pricing-api
    ports:
      - "5000:5000"
    environment:
      PORT: "5000"
      # Set RETRAIN_TOKEN in your environment if retraining authorization is needed.
      RETRAIN_TOKEN: "${RETRAIN_TOKEN:-}"
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
