# inventory.ini: Generated from terraform output or populated for local/staging target hosts
# Note: Real production IPs and SSH private keys must never be committed to git.

[ci]
ci-vm ansible_host=10.10.0.10 ansible_user=aditya

[elk]
elk-vm ansible_host=10.10.0.11 ansible_user=aditya

[app]
app-vm ansible_host=10.10.0.12 ansible_user=aditya

[all:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
