input {
  beats {
    port => 5044
  }
  http {
    port => 5080
    codec => json
  }
}

filter {
  if [message] =~ /^\{.*/ {
    json {
      source => "message"
    }
  }
  date {
    match => [ "timestamp", "ISO8601" ]
    target => "@timestamp"
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "pricing-logs-%{+YYYY.MM.dd}"
    manage_template => true
    template_name => "pricing-logs"
    template => "/usr/share/logstash/templates/elasticsearch-template.json"
  }
  stdout { codec => rubydebug }
}